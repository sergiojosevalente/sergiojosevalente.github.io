<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="142 122 420 420">
  <title>Moxtel</title>
  <!-- Vector redraw of the Moxtel tile (assets/brand/moxtel-logo.png), in the
       artwork's own pixel coordinates. -->

  <!-- tile -->
  <rect x="142" y="122" width="420" height="420" rx="80" ry="80" fill="#2a2d30"/>

  <!-- grey arc (connection / window frame) -->
  <path d="M160 264 L346 170 L475 189 L526 298 L455 464 L472 327 L447 251 L390 240 L276 237 Z"
        fill="#a3a3a3" stroke="#a3a3a3" stroke-width="4" stroke-linejoin="round"/>

  <!-- red prompt chevron -->
  <path d="M166 267 L342 353 L177 468 L198 404 L247 358 L194 326 Z"
        fill="#d10f1a" stroke="#d10f1a" stroke-width="4" stroke-linejoin="round"/>

  <!-- cursor -->
  <rect x="290" y="418" width="136" height="30" rx="7" ry="7" fill="#a3a3a3"/>
</svg>
